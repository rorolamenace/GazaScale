name: Release v1.13.0 (one-off)
on:
  push:
    branches: [claude/serene-mendel-j2m6t6]
    paths: [.github/workflows/release-once.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.13.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "déjà publiée"; exit 0; fi
          gh release create v1.13.0 --repo "$GITHUB_REPOSITORY" \
            --target 7580cb328a334955f102780710d332395df52b9a \
            --title "GazaScale 1.13" --latest \
            --notes "Unités et chiffres officiels pour cinq pays de plus : Philippines (1 634 villes et municipalités au lieu de 17 régions, projections PSA 2025), Afrique du Sud (4 392 quartiers officiels, totaux municipaux du recensement 2022 de Stats SA), Australie (2 454 zones SA2, estimations ABS au 30 juin 2025, mises à jour chaque année automatiquement), Indonésie (514 régences et villes, recensement BPS 2020) et Nigeria (773 LGA, projections NPC 2022)."
