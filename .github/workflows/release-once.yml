name: Release v1.10.1 (one-off)
on:
  push:
    branches: [claude/serene-mendel-j2m6t6]
    paths: [.github/workflows/release-once.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.10.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "déjà publiée"; exit 0; fi
          gh release create v1.10.1 --repo "$GITHUB_REPOSITORY" \
            --target e7af8c0ea139eef5e81e08d074d71fc6465336f6 \
            --title "GazaScale 1.10.1" --latest \
            --notes "Revenir du cercle au contour rend à Gaza son orientation réelle, légèrement oblique. La visite guidée l'indique, en français et en anglais."
