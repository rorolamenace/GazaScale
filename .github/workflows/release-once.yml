name: Release v1.6.0 (one-off)
on:
  push:
    branches: [claude/serene-mendel-j2m6t6]
    paths: [.github/workflows/release-once.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.6.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "déjà publiée"; exit 0; fi
          gh release create v1.6.0 --repo "$GITHUB_REPOSITORY" \
            --target 05e26702eb21b127394caeb5e0b0875c1cae54f4 \
            --title "GazaScale 1.6" --latest \
            --notes "Population de Gaza en zone bleue (option dans Affichage) et panneau Victimes repensé : bloc « Victimes transposées chez vous » avec Vies perdues et Blessés en sections indépendantes, barre de défilement fine et stable. Le bouton Victimes appelle après la visite et après chaque déplacement ; menu et panneau Victimes s'excluent. Sur mobile : accueil en panneau bas à mi-écran (bombardements, vies perdues, blessés), réduit en barre au toucher de la carte, recherche à gauche, crédits repliés dans un « i ». Visite guidée terminée sur le bouton « ? ». Boutons Communes / Département / Région retirés."
