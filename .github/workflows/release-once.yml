name: Release v1.3.1 (one-off)
on:
  push:
    branches: [claude/serene-mendel-j2m6t6]
    paths: [.github/workflows/release-once.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "déjà publiée"; exit 0; fi
          gh release create v1.3.1 --repo "$GITHUB_REPOSITORY" \
            --target cd4af7511e9f504ab1f77c2b85d1392273fc4ad7 \
            --title "GazaScale 1.3.1" --latest \
            --notes "Correctif : la flèche de la poignée de rotation est redessinée et centrée dans son cercle. Les fichiers modifiés portent un numéro de version pour que les navigateurs chargent la nouvelle version sans attendre l'expiration du cache. Le reste du site est inchangé depuis la version 1.3."
