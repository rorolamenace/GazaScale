name: Release v1.15.1 (one-off)
on:
  push:
    branches: [claude/serene-mendel-j2m6t6]
    paths: [.github/workflows/release-once.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.15.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "déjà publiée"; exit 0; fi
          gh release create v1.15.1 --repo "$GITHUB_REPOSITORY" \
            --target e5aaaede897dd53aedea565e5c1448625c8cd4f6 \
            --title "GazaScale 1.15.1" --latest \
            --notes "Accessibilité, mobile et robustesse. Les noms en arabe ou en hébreu ne mélangent plus les chiffres des phrases. Démarrage plus léger (97 Ko compressés de moins). Au clavier, Maj + flèches fait pivoter Gaza et la recherche vient en premier. Sur téléphone : cibles tactiles de 44 px, texte de lecture plus grand, en-tête qui tient à 320 px. En paysage et dans les fenêtres peu hautes, le panneau des victimes s'ouvre dans l'écran et les boutons ne se chevauchent plus. Couleurs regroupées en variables, animations sobres pour qui le demande."
