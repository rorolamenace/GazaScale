name: Release v1.9.0 (one-off)
on:
  push:
    branches: [claude/serene-mendel-j2m6t6]
    paths: [.github/workflows/release-once.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.9.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "déjà publiée"; exit 0; fi
          gh release create v1.9.0 --repo "$GITHUB_REPOSITORY" \
            --target 89e842cc80f8662637f025e93ecbf56bbc2ed56e \
            --title "GazaScale 1.9" --latest \
            --notes "Gaza n'importe où dans le monde. États-Unis : 36 000 subdivisions de comté du Census, estimations 2024. 181 autres pays d'après Kontur Boundaries 2023 (limites OpenStreetMap, population estimée), au niveau administratif le plus fin réunissant 90 % de la population. Bande de Gaza en cinq gouvernorats (total PCBS fin 2025). Cisjordanie actualisée à 2023 (projection PCBS/UNFPA). Recherche de villes et de pays dans le monde entier, visite guidée et sources mises à jour, en français et en anglais."
