name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gazascale

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t "${IMAGE,,}:${GITHUB_SHA}" -t "${IMAGE,,}:latest" .
      - name: Smoke test
        run: |
          docker run -d --name site -p 8080:80 "${IMAGE,,}:latest"
          sleep 2
          curl -fsS http://127.0.0.1:8080/ | grep -q 'GazaScale'
          curl -fsSI http://127.0.0.1:8080/app.js | grep -qi 'content-type: application/javascript'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/introuvable)" = 404
      - name: Push to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGE,,}:${GITHUB_SHA}"
          docker push "${IMAGE,,}:latest"

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Create or redeploy the Jelastic environment (Infomaniak)
        env:
          JELASTIC_TOKEN: ${{ secrets.JELASTIC_TOKEN_GAZASCALE }}
          API_HOST: ${{ vars.JELASTIC_API_HOST || 'app.jpe.infomaniak.com' }}
          ENV_NAME: ${{ vars.JELASTIC_ENV_NAME || 'gazascale' }}
          NODE_GROUP: ${{ vars.JELASTIC_NODE_GROUP || 'cp' }}
          TAG: ${{ github.sha }}
        run: IMAGE="${IMAGE,,}" deploy/jelastic.sh
