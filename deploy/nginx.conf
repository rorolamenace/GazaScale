# Live figures (OCHA toll, share images, population updates) come from the live-data branch of the
# public repository, so they change without redeploying the site. Cached here, served stale if GitHub fails.
proxy_cache_path /var/cache/nginx/live levels=1:2 keys_zone=live:2m max_size=500m inactive=30d use_temp_path=off;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip_static on;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;
    gzip_min_length 1024;


    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.zstats.fr; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://tiles.openfreemap.org; font-src 'self'; connect-src 'self' https://geo.api.gouv.fr https://tiles.openfreemap.org https://www.zstats.fr; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'none'" always;

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.zstats.fr; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://tiles.openfreemap.org; font-src 'self'; connect-src 'self' https://geo.api.gouv.fr https://tiles.openfreemap.org https://www.zstats.fr; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'none'" always;
    }

    location ~* \.(?:woff2|png|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Commune data: stored compressed only (see Dockerfile), unpacked for the rare client without gzip.
    location ~ ^/(?:eu|it|ch|me|wd|us)/ {
        gzip_static always;
        gunzip on;
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(?:js|css|json)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /live/ {
        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
        resolver_timeout 5s;
        set $live_host raw.githubusercontent.com;
        rewrite ^/live/(.*)$ /rorolamenace/GazaScale/live-data/$1 break;
        proxy_pass https://$live_host;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name raw.githubusercontent.com;
        proxy_set_header Host raw.githubusercontent.com;
        proxy_set_header Cookie "";
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache live;
        proxy_cache_key $uri;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header Cache-Control "public, max-age=600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Links shared from the English version get English titles and previews.
    location = / {
        if ($arg_lang = en) {
            rewrite ^ /index.en.html last;
        }
        rewrite ^ /index.html last;
    }

    location = /index.en.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.zstats.fr; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://tiles.openfreemap.org; font-src 'self'; connect-src 'self' https://geo.api.gouv.fr https://tiles.openfreemap.org https://www.zstats.fr; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'none'" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
